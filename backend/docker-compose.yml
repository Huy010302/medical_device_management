services:
  postgres:
    image: postgres:16
    container_name: meddevice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meddevice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - meddevice_pgdata:/var/lib/postgresql/data

volumes:
  meddevice_pgdata:
