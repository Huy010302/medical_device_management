services:
  namenode:
    image: apache/hadoop:3
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-root/dfs/name
  datanode:
    image: apache/hadoop:3
    hostname: datanode
    command: ["hdfs", "datanode"]
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
